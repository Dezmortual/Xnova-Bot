# Fly.io deployment configuration
# Deploy with: fly launch (then fly deploy)
app = "xnova-trading-bot"
primary_region = "jnb"    # Johannesburg (closest to you, change if you want)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# Free-tier VM (256MB — more than enough for this bot)
[vm]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent volume for portfolio state (so trades/balance survive restarts)
[mounts]
  source = "xnovadata"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false     # NEVER auto-stop (24/7 trading!)
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
